<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mémo IFSI — Réa · Urgences · Bloc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f3ec;
    --bg-2:#efeae0;
    --paper:#fbf9f3;
    --ink:#181613;
    --ink-2:#3b3733;
    --muted:#75706a;
    --line:#d9d2c4;
    --line-2:#c2b9a6;
    --accent:#0b6b5a;      /* teal médical */
    --accent-2:#0a5547;
    --warn:#b8590f;        /* ocre */
    --crit:#a8201a;        /* rouge urgence */
    --good:#3a6b1f;
    --info:#1e4a7a;
    --pill:#ecead9;
    --radius:14px;
    --shadow:0 1px 0 rgba(0,0,0,.04), 0 8px 32px -16px rgba(0,0,0,.18);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:"Inter Tight",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11"}
  body{min-height:100vh;background:
      radial-gradient(1200px 600px at 90% -10%, #efe3c8 0%, transparent 60%),
      radial-gradient(800px 400px at -10% 110%, #d8e5e0 0%, transparent 60%),
      var(--bg);
  }
  a{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 30%, transparent)}
  a:hover{color:var(--accent-2)}
  /* ============== APP LAYOUT ============== */
  .app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
  @media (max-width:980px){.app{grid-template-columns:1fr}}
  /* Sidebar */
  .side{
    position:sticky;top:0;height:100vh;overflow:auto;
    background:var(--paper);border-right:1px solid var(--line);
    padding:24px 18px 32px;
  }
  @media (max-width:980px){.side{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}}
  .brand{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
  .brand-mark{
    width:42px;height:42px;border-radius:11px;flex:0 0 42px;
    background:linear-gradient(135deg,var(--accent) 0%, #0e8a73 100%);
    display:grid;place-items:center;color:#fff;font-weight:700;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25);
    font-family:"Fraunces",serif;letter-spacing:-.02em;
  }
  .brand-mark::before{content:"+";font-size:30px;line-height:1;transform:translateY(-1px)}
  .brand h1{
    font-family:"Fraunces",serif;font-weight:600;letter-spacing:-.02em;
    margin:0;font-size:22px;line-height:1.05;
  }
  .brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px;letter-spacing:.04em;text-transform:uppercase}
  .search{position:relative;margin:10px 0 18px}
  .search input{
    width:100%;padding:11px 14px 11px 38px;border-radius:10px;border:1px solid var(--line);
    background:#fff;font:inherit;font-size:14px;color:var(--ink);outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%, transparent)}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);border:1px solid var(--line);padding:1px 6px;border-radius:5px;background:var(--bg)}
  .nav-title{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 6px 8px}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav button{
    text-align:left;border:0;background:transparent;color:var(--ink-2);
    padding:9px 11px;border-radius:9px;font:inherit;font-size:14px;cursor:pointer;
    display:flex;align-items:center;gap:10px;line-height:1.2;
  }
  .nav button:hover{background:var(--bg-2);color:var(--ink)}
  .nav button.active{background:var(--ink);color:#fff}
  .nav .num{font-family:"JetBrains Mono",monospace;font-size:11px;opacity:.7;min-width:22px}
  .footer-note{margin-top:24px;padding:12px;border-radius:10px;background:var(--bg-2);font-size:12px;color:var(--muted);line-height:1.45}
  .footer-note strong{color:var(--ink-2)}

  /* Main */
  main{padding:36px clamp(20px,5vw,56px) 80px;max-width:1180px}
  .hero{margin-bottom:28px}
  .eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  h2.title{
    font-family:"Fraunces",serif;font-weight:500;letter-spacing:-.025em;
    font-size:clamp(34px,5vw,52px);margin:0;line-height:1;
  }
  h2.title em{font-style:italic;color:var(--accent)}
  .lede{margin:16px 0 0;max-width:62ch;color:var(--ink-2);font-size:16.5px;line-height:1.6}

  /* Section */
  section{display:none}
  section.show{display:block;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* Cards & blocks */
  .grid{display:grid;gap:18px}
  .grid.cols-2{grid-template-columns:repeat(2,1fr)}
  .grid.cols-3{grid-template-columns:repeat(3,1fr)}
  @media (max-width:820px){.grid.cols-2,.grid.cols-3{grid-template-columns:1fr}}
  .card{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px 22px 20px;box-shadow:var(--shadow);
  }
  .card h3{
    font-family:"Fraunces",serif;font-weight:500;letter-spacing:-.015em;
    font-size:22px;margin:0 0 6px;line-height:1.15;
  }
  .card h4{font-family:"Fraunces",serif;font-weight:600;font-size:16px;margin:18px 0 6px;letter-spacing:-.01em}
  .card p{margin:6px 0;color:var(--ink-2);line-height:1.55;font-size:15px}
  .card ul,.card ol{margin:6px 0 6px 18px;padding:0}
  .card li{margin:4px 0;color:var(--ink-2);line-height:1.55;font-size:15px}
  .card li::marker{color:var(--accent)}

  /* Pills / tags */
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--pill);color:var(--ink-2);font-size:12px;font-weight:500;letter-spacing:.02em;border:1px solid var(--line)}
  .pill.crit{background:#f8e1df;color:var(--crit);border-color:#eec0bc}
  .pill.warn{background:#f6e5cf;color:var(--warn);border-color:#e8c89a}
  .pill.good{background:#dbe9cf;color:var(--good);border-color:#bcd4a9}
  .pill.info{background:#d8e3f1;color:var(--info);border-color:#b2c6df}
  .pill.accent{background:#cee5df;color:var(--accent-2);border-color:#a4cabf}

  .row-tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}

  /* Callouts */
  .callout{
    border-left:3px solid var(--accent);background:#eaf2ef;padding:12px 14px;border-radius:8px;
    margin:14px 0;font-size:14.5px;line-height:1.55;color:var(--ink-2);
  }
  .callout.crit{border-color:var(--crit);background:#fbeae8}
  .callout.warn{border-color:var(--warn);background:#fbeed7}
  .callout.info{border-color:var(--info);background:#e1ecf6}
  .callout.good{border-color:var(--good);background:#e5efd9}
  .callout strong{color:var(--ink)}
  .callout .label{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-right:6px}

  /* Tables */
  .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff;margin:12px 0 8px}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink-2)}
  th{background:var(--bg-2);color:var(--ink);font-weight:600;font-size:13px;letter-spacing:.02em;text-transform:uppercase;font-family:"Inter Tight",sans-serif}
  tr:last-child td{border-bottom:0}
  td code, .mono{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--ink)}

  /* Color swatch (cathéters) */
  .swatch{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.15);vertical-align:-1px;margin-right:6px}

  /* Section header */
  .sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:36px 0 18px;flex-wrap:wrap}
  .sec-head h3.h{font-family:"Fraunces",serif;font-weight:500;font-size:28px;letter-spacing:-.02em;margin:0;line-height:1.1}
  .sec-head .desc{color:var(--muted);font-size:14px;max-width:60ch}

  /* Flashcard quiz */
  .quiz{margin-top:8px;display:flex;flex-direction:column;gap:10px}
  .qa{
    background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;
    cursor:pointer;transition:border-color .15s ease, transform .15s ease;
  }
  .qa:hover{border-color:var(--line-2)}
  .qa .q{font-weight:600;color:var(--ink);font-size:14.5px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .qa .q::after{content:"+";color:var(--muted);font-size:18px;line-height:1;transition:transform .2s ease}
  .qa.open .q::after{transform:rotate(45deg)}
  .qa .a{max-height:0;overflow:hidden;transition:max-height .25s ease;color:var(--ink-2);font-size:14px;line-height:1.6}
  .qa.open .a{max-height:600px;padding-top:8px}

  /* No results */
  .empty{padding:40px 16px;text-align:center;color:var(--muted)}
  mark{background:#ffe9a8;color:var(--ink);border-radius:3px;padding:0 2px}

  /* Drug grid mini */
  .drug{
    background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  }
  .drug h5{font-family:"Fraunces",serif;font-size:16px;margin:0 0 4px;font-weight:600;letter-spacing:-.01em}
  .drug .meta{color:var(--muted);font-size:12.5px;margin-bottom:6px}
  .drug ul{margin:4px 0 0 16px;font-size:13.5px}
  .drug ul li{margin:2px 0}

  /* Mini key/value */
  .kv{display:grid;grid-template-columns:160px 1fr;gap:8px 16px;font-size:14px;margin:8px 0}
  .kv dt{color:var(--muted)}
  .kv dd{margin:0;color:var(--ink-2)}

  /* Top bar mobile */
  .topbar{display:none}
  @media (max-width:980px){
    .topbar{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
    .topbar select{flex:1;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;font:inherit}
    .side{padding:18px}
  }

  /* Print */
  @media print{
    .side,.topbar{display:none}
    body{background:#fff}
    section{display:block !important;page-break-after:always}
    .card{box-shadow:none}
  }
</style>
</head>
<body>
<div class="app">

  <!-- ============ SIDEBAR ============ -->
  <aside class="side">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div>
        <h1>Mémo IFSI</h1>
        <p>Réa · Urgences · Bloc</p>
      </div>
    </div>

    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="search" placeholder="Rechercher (catécho, VVC, FiO2…)" autocomplete="off">
    </div>

    <div class="nav-title">Chapitres</div>
    <nav class="nav" id="nav"></nav>

    <div class="footer-note">
      <strong>Avertissement.</strong> Outil pédagogique de révision. Les protocoles peuvent varier d'un service à l'autre — toujours se référer aux <em>protocoles internes</em> du service et à la prescription médicale.
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <div>
    <div class="topbar">
      <strong style="font-family:Fraunces,serif;font-size:18px">Mémo IFSI</strong>
      <select id="navMobile"></select>
    </div>

    <main id="main">
      <!-- Sections injectées en JS -->
    </main>
  </div>

</div>

<!-- ================= DATA ================= -->
<script>
/* ============================================================
   STRUCTURE DES DONNÉES
   chaque section : { id, num, title, eyebrow, lede, html }
   ============================================================ */
const SECTIONS = [
/* ====================================================== */
{
  id:"voies",
  num:"01",
  title:"Voies d'abord vasculaires",
  eyebrow:"Chapitre 01 · accès veineux & artériels",
  lede:"VVP, VVC, KTA, intra-osseuse, PICC : choisir la bonne voie selon le produit, le débit, la durée et l'urgence. Comprendre <em>pourquoi</em> certains médicaments ne tolèrent qu'une voie centrale.",
  html:`
  <div class="grid cols-2">

    <div class="card">
      <h3>VVP — Voie Veineuse Périphérique</h3>
      <div class="row-tags">
        <span class="pill accent">Standard</span>
        <span class="pill">Durée &lt; 96h (recos)</span>
        <span class="pill">Débit selon calibre</span>
      </div>
      <p>Cathéter court (24-48 mm) en veine périphérique du membre supérieur. <strong>Première intention</strong> pour la quasi-totalité des perfusions, transfusions et médicaments non irritants. Réfection / changement de site recommandé <strong>toutes les 72-96h</strong> (surveillance Maddox quotidienne).</p>

      <h4>Calibres & couleurs (norme ISO)</h4>
      <div class="table-wrap">
      <table>
        <thead><tr><th>Couleur</th><th>Gauge</th><th>Débit max</th><th>Indication type</th></tr></thead>
        <tbody>
          <tr><td><span class="swatch" style="background:#f59e0b"></span>Orange</td><td>14 G</td><td>≈ 270 mL/min</td><td>Polytrauma, choc hémorragique, transfusion massive</td></tr>
          <tr><td><span class="swatch" style="background:#9ca3af"></span>Gris</td><td>16 G</td><td>≈ 200 mL/min</td><td>Hémorragie, remplissage massif, chir lourde</td></tr>
          <tr><td><span class="swatch" style="background:#10b981"></span>Vert</td><td>18 G</td><td>≈ 96 mL/min</td><td>Transfusion CGR / PFC, urgence</td></tr>
          <tr><td><span class="swatch" style="background:#ec4899"></span>Rose</td><td>20 G</td><td>≈ 60 mL/min</td><td>Standard adulte, antibiothérapie</td></tr>
          <tr><td><span class="swatch" style="background:#3b82f6"></span>Bleu</td><td>22 G</td><td>≈ 36 mL/min</td><td>Capital veineux fragile, sujet âgé, pédiatrie</td></tr>
          <tr><td><span class="swatch" style="background:#facc15"></span>Jaune</td><td>24 G</td><td>≈ 20 mL/min</td><td>Nouveau-né, nourrisson, veines très fines</td></tr>
        </tbody>
      </table>
      </div>

      <div class="callout warn"><span class="label">À retenir</span> Pour <strong>transfuser</strong>, viser au minimum un <strong>20 G (rose)</strong>, idéalement <strong>18 G (vert)</strong> ou plus. En transfusion massive : <strong>2 voies de 16-18 G</strong> minimum.</div>

      <h4>Sites à privilégier / à éviter</h4>
      <ul>
        <li><strong>Privilégier :</strong> avant-bras (céphalique, basilique), dos de la main en dernier recours.</li>
        <li><strong>Éviter :</strong> pli du coude (mobilisation), membre côté curage axillaire / FAV / parésie / lymphœdème / brûlure.</li>
        <li>Désinfection en <strong>4 temps</strong> (détersion, rinçage, séchage, antisepsie) avec antiseptique alcoolique (chlorhexidine alcoolique 2%).</li>
      </ul>
    </div>

    <div class="card">
      <h3>VVC — Voie Veineuse Centrale</h3>
      <div class="row-tags">
        <span class="pill info">Réa / Onco / Nutrition</span>
        <span class="pill crit">Acte médical</span>
      </div>
      <p>Cathéter long dont l'extrémité se situe dans la <strong>veine cave supérieure</strong> (jonction VCS-OD). Pose <strong>médicale</strong>, sous écho, en conditions stériles chirurgicales. Vérification radio post-pose <strong>obligatoire</strong> avant utilisation (sauf si pose écho-guidée validée et urgence).</p>

      <h4>Sites de pose</h4>
      <div class="table-wrap">
      <table>
        <thead><tr><th>Site</th><th>Avantages</th><th>Inconvénients</th></tr></thead>
        <tbody>
          <tr><td><strong>Jugulaire interne D</strong></td><td>Echo facile, moindre risque pneumothorax, trajet court</td><td>Inconfort patient, mobilisation cou</td></tr>
          <tr><td><strong>Sous-clavière</strong></td><td>Confort patient, fixation stable, faible risque infectieux</td><td>Risque <strong>pneumothorax</strong>, ponction non compressible</td></tr>
          <tr><td><strong>Fémorale</strong></td><td>Rapide, voie de secours, pas de risque pneumothorax</td><td>Risque infectieux <strong>++</strong>, thrombose, immobilisation</td></tr>
        </tbody>
      </table>
      </div>

      <h4>Indications majeures</h4>
      <ul>
        <li><strong>Drogues vasoactives</strong> (catécholamines : noradrénaline, adrénaline, dobutamine).</li>
        <li>Nutrition parentérale (osmolarité &gt; 800-900 mOsm/L).</li>
        <li>Solutés hypertoniques (NaCl 10/20%, KCl concentré, bicarbonate molaire).</li>
        <li>Chimiothérapies vésicantes.</li>
        <li>Capital veineux épuisé, hémodialyse, PVC.</li>
      </ul>

      <div class="callout crit"><span class="label">Pourquoi</span> Une <strong>extravasation</strong> de noradrénaline ou de KCl concentré sur VVP provoque <strong>nécrose tissulaire grave</strong>. Le débit sanguin élevé de la VCS dilue immédiatement le produit → sécurité.</div>

      <h4>Surveillance & complications</h4>
      <ul>
        <li><strong>Pneumothorax</strong> (sus-claviculaire) : dyspnée brutale, douleur, désaturation.</li>
        <li><strong>Hémorragie / hématome.</strong></li>
        <li><strong>Infection liée au cathéter (ILC)</strong> : fièvre inexpliquée, frissons à la manipulation → hémocultures couplées (KT + périph).</li>
        <li><strong>Thrombose veineuse</strong>, embolie gazeuse (clamper toujours en cas d'ouverture).</li>
        <li>Pansement transparent stérile, réfection si souillé / décollé, datée.</li>
      </ul>
    </div>

    <div class="card">
      <h3>PICC line & Midline</h3>
      <p><strong>PICC</strong> (Peripherally Inserted Central Catheter) : cathéter central inséré dans une veine du bras (basilique), extrémité en VCS. <strong>Idem VVC</strong> en termes d'indications (catécholamines, NP, ATB longue durée). Confort patient supérieur, posable par IDE habilité sous écho. Durée plusieurs semaines à mois.</p>
      <p><strong>Midline</strong> : cathéter <strong>périphérique long</strong> (20 cm env.), extrémité en veine axillaire — <strong>PAS central</strong>. Permet une antibiothérapie / hydratation de 1-4 semaines mais <strong>jamais de catécholamines / NP / produits hyperosmolaires</strong>.</p>
      <div class="callout info"><strong>Piège classique :</strong> ne pas confondre Midline et PICC. Midline = <em>périphérique</em>, donc même restrictions qu'une VVP.</div>
    </div>

    <div class="card">
      <h3>Cathéter artériel (KTA)</h3>
      <p>Cathéter en artère <strong>radiale</strong> (le plus souvent), fémorale ou humérale. Permet :</p>
      <ul>
        <li>Monitorage <strong>continu de la PA</strong> (courbe artérielle).</li>
        <li>Prélèvements répétés (gazométrie, ionogrammes) <strong>sans piquer</strong>.</li>
      </ul>
      <p>Branché sur tête de pression + poche pressurisée à <strong>300 mmHg</strong> de NaCl 0,9% (parfois hépariné selon protocole). Test d'Allen avant pose radiale.</p>
      <div class="callout crit"><strong>JAMAIS</strong> d'injection médicamenteuse sur un KTA — risque ischémique majeur. Ligne identifiée par étiquette rouge. Toujours vérifier la courbe avant interprétation d'une PA.</div>
    </div>

    <div class="card">
      <h3>Voie intra-osseuse (IO)</h3>
      <div class="row-tags"><span class="pill crit">Urgence vitale</span><span class="pill">90 sec d'échec VVP</span></div>
      <p>Pose dans la <strong>moelle osseuse</strong> (tibia proximal, humérus, sternum) à l'aide d'un dispositif type EZ-IO. <strong>Voie de secours en ACR / urgence vitale</strong> quand la VVP est impossible après 2 tentatives ou 90 secondes.</p>
      <ul>
        <li>Tout ce qui passe en IV passe en IO (cristalloïdes, drogues d'arrêt, sang).</li>
        <li>À retirer dès qu'une voie veineuse fiable est en place (max 24h).</li>
        <li>Très douloureux chez patient conscient → lidocaïne IO avant perfusion.</li>
      </ul>
    </div>

    <div class="card">
      <h3>Chambre implantable (PAC / Port-a-cath)</h3>
      <p>Boîtier sous-cutané (thorax) relié à un KT central. Accès via <strong>aiguille de Huber</strong> uniquement (jamais d'aiguille standard, biseau coupant = destruction du septum).</p>
      <ul>
        <li>Indications : chimiothérapies prolongées, ATB au long cours, NP.</li>
        <li>Rinçage <strong>pulsé</strong> NaCl 0,9% (10-20 mL) après chaque utilisation ; héparinisation selon protocole entre les cures.</li>
        <li>Retour veineux à vérifier systématiquement avant injection.</li>
      </ul>
    </div>

  </div>
  `
},

/* ====================================================== */
{
  id:"oxy",
  num:"02",
  title:"Oxygénothérapie & Ventilation",
  eyebrow:"Chapitre 02 · du débit nasal à la VNI",
  lede:"Lunettes, masque, MHC, Optiflow, VNI : chaque dispositif a son débit, sa FiO2 et ses indications. Savoir <em>pourquoi</em> on passe de l'un à l'autre est central en réa et urgences.",
  html:`
  <div class="card">
    <h3>Le principe : débit d'O₂ & FiO2</h3>
    <p>La <strong>FiO2</strong> (fraction inspirée d'O₂) est la concentration d'oxygène délivrée. Air ambiant = 21%. Chaque dispositif a une FiO2 <strong>approximative</strong> qui dépend du débit ET de la ventilation du patient (un patient qui hyperventile dilue plus l'O₂).</p>
    <div class="table-wrap">
    <table>
      <thead><tr><th>Dispositif</th><th>Débit O₂</th><th>FiO2 estimée</th><th>Indication</th></tr></thead>
      <tbody>
        <tr><td>Lunettes</td><td>1-6 L/min</td><td>24-44%</td><td>Hypoxémie modérée, confort</td></tr>
        <tr><td>Masque simple</td><td>5-10 L/min</td><td>40-60%</td><td>Insuffisance respi aiguë</td></tr>
        <tr><td>Masque à haute concentration (MHC)</td><td>10-15 L/min</td><td>60-95%</td><td>Détresse, MHC <strong>ballon gonflé</strong></td></tr>
        <tr><td>Venturi</td><td>variable</td><td>24-50% <em>réglable précisément</em></td><td>BPCO (titration fine, éviter hypercapnie)</td></tr>
        <tr><td>Optiflow (OHD)</td><td>jusqu'à 60 L/min</td><td>21-100%</td><td>IRA hypoxémique, post-extubation</td></tr>
        <tr><td>VNI</td><td>—</td><td>21-100% + pression</td><td>OAP, BPCO décompensée</td></tr>
        <tr><td>Ventilation invasive</td><td>—</td><td>21-100% + pression</td><td>Glasgow &lt; 8, échec VNI, ACR</td></tr>
      </tbody>
    </table>
    </div>
    <div class="callout warn"><span class="label">BPCO</span> Chez le BPCO chronique hypercapnique, <strong>ne pas hyperoxygéner</strong> : objectif <strong>SpO₂ 88-92%</strong>. Trop d'O₂ → narcose au CO₂ (perte du stimulus hypoxique). Privilégier Venturi à débit calibré.</div>
  </div>

  <div class="grid cols-2">

    <div class="card">
      <h3>Lunettes à O₂</h3>
      <div class="row-tags"><span class="pill good">Confort</span><span class="pill">1-6 L/min</span></div>
      <p>Canule binasale. Confortable, permet la parole et l'alimentation. Au-delà de <strong>6 L/min</strong> : inefficace + irritation nasale + assèchement → passer à un masque.</p>
      <ul>
        <li>Règle simple : <em>FiO2 ≈ 21 + (4 × débit en L/min)</em> — approximative.</li>
        <li>1L → ~24%, 2L → ~28%, 3L → ~32%, 4L → ~36%, 5L → ~40%, 6L → ~44%.</li>
        <li>Humidification recommandée au-dessus de 3-4 L/min en continu.</li>
      </ul>
    </div>

    <div class="card">
      <h3>Masque à haute concentration (MHC)</h3>
      <div class="row-tags"><span class="pill crit">Urgence</span><span class="pill">10-15 L/min</span></div>
      <p>Masque à <strong>réservoir</strong> (ballon) avec valves anti-retour. Le ballon doit rester <strong>gonflé</strong> en permanence (sinon le patient inspire de l'air ambiant et la FiO2 chute).</p>
      <ul>
        <li>Débit minimum <strong>10 L/min</strong>, idéalement 12-15 L/min.</li>
        <li>Indication : détresse respiratoire aiguë, intoxication CO, polytraumatisé.</li>
        <li>Inadapté pour usage prolongé (assèchement, pas d'humidification).</li>
      </ul>
      <div class="callout crit">Si le ballon se collabe à l'inspiration : <strong>augmenter le débit</strong> — c'est le signe que le patient inspire plus que vous ne fournissez.</div>
    </div>

    <div class="card">
      <h3>Optiflow / OHD — Oxygénothérapie haut débit</h3>
      <div class="row-tags"><span class="pill accent">Réa / Urgences</span><span class="pill">jusqu'à 60 L/min</span></div>
      <p>Système qui délivre un mélange <strong>air-O₂ réchauffé (37°C) et humidifié (100%)</strong> via des canules nasales larges, à très haut débit (généralement 30-60 L/min). La FiO2 est <strong>réglable précisément de 21 à 100%</strong>.</p>

      <h4>Mécanismes d'action</h4>
      <ul>
        <li><strong>Lavage de l'espace mort</strong> nasopharyngé → meilleure élimination du CO₂.</li>
        <li>Génère une <strong>PEP</strong> minime (~3-5 cmH₂O bouche fermée) → recrute les alvéoles.</li>
        <li>Réduit le travail respiratoire (pas besoin de réchauffer/humidifier l'air).</li>
        <li>Améliore la clairance mucociliaire.</li>
      </ul>

      <h4>Indications</h4>
      <ul>
        <li>Insuffisance respiratoire aiguë hypoxémique (pneumopathie, SDRA léger).</li>
        <li>Post-extubation, sevrage progressif.</li>
        <li>Préoxygénation avant intubation.</li>
        <li>Soins palliatifs (mieux toléré que VNI).</li>
      </ul>

      <div class="callout info"><strong>Réglages typiques :</strong> débit 50 L/min, FiO2 ajustée à la SpO₂ cible (≥ 92%, ou 88-92% si BPCO). Surveillance : SpO₂, FR, signes de lutte, indice ROX (= SpO₂/FiO2 / FR).</div>
    </div>

    <div class="card">
      <h3>VNI — Ventilation Non Invasive</h3>
      <div class="row-tags"><span class="pill info">CPAP · BiPAP</span></div>
      <p>Ventilation à pression positive par <strong>masque</strong> (facial, naso-buccal, total face). Évite l'intubation. Deux modes principaux :</p>

      <h4>CPAP — Continuous Positive Airway Pressure</h4>
      <ul>
        <li><strong>Une seule pression</strong> constante (≈ PEP) maintenue tout au long du cycle.</li>
        <li>Recrute les alvéoles, lutte contre l'œdème.</li>
        <li><strong>Indication phare : OAP cardiogénique.</strong></li>
      </ul>

      <h4>BiPAP (VS-AI-PEP)</h4>
      <ul>
        <li><strong>Deux niveaux</strong> de pression : <strong>AI</strong> (aide inspiratoire) à l'inspiration + <strong>PEP</strong> à l'expiration.</li>
        <li>Soulage le travail respiratoire (l'AI fait "le travail").</li>
        <li><strong>Indication phare : BPCO en décompensation hypercapnique</strong> (pH &lt; 7,35 + hypercapnie).</li>
      </ul>

      <h4>Contre-indications</h4>
      <ul>
        <li>Trouble de conscience / coma (sauf BPCO hypercapnique).</li>
        <li>Vomissements, hémorragie digestive haute.</li>
        <li>Traumatisme facial / chirurgie ORL récente.</li>
        <li>Instabilité hémodynamique sévère, ACR.</li>
        <li>Pneumothorax non drainé.</li>
        <li>Patient non coopérant.</li>
      </ul>

      <div class="callout warn">Surveiller : tolérance du masque (escarre arête du nez), fuites, asynchronie, distension gastrique, conjonctivite. Réévaluer à 1h et 4h : si pas d'amélioration → <strong>intubation</strong>.</div>
    </div>

    <div class="card">
      <h3>Ventilation invasive</h3>
      <p>Ventilation mécanique via une <strong>sonde d'intubation</strong> (orotrachéale, nasotrachéale) ou <strong>trachéotomie</strong>. Patient sédaté, parfois curarisé.</p>
      <ul>
        <li><strong>Indications</strong> : Glasgow &lt; 8, ACR, échec VNI, choc, SDRA modéré-sévère, protection des voies aériennes.</li>
        <li><strong>Modes</strong> : VAC (volume contrôlé), VPC (pression contrôlée), VS-AI-PEP (sevrage).</li>
        <li><strong>Paramètres clés</strong> : Vt 6-8 mL/kg de poids idéal, FR, PEP, FiO2.</li>
      </ul>
      <p><strong>Soins infirmiers :</strong> surveillance étanchéité ballonnet (20-30 cmH₂O), aspiration trachéale stérile au besoin, soins de bouche bétadine buccale 4x/j, position semi-assise 30-45° (prévention PAVM), prévention escarres talons / occiput.</p>
    </div>

  </div>

  <div class="callout good"><span class="label">Escalade thérapeutique type</span> Lunettes → Masque simple → MHC → Optiflow → VNI → Intubation. Ne jamais retarder l'intubation devant des signes d'épuisement (FR &gt; 35, sueurs, tirage majeur, encombrement, troubles de conscience).</div>
  `
},

{
  id:"catecho",
  num:"03",
  title:"Catécholamines & amines vasoactives",
  eyebrow:"Chapitre 03 · drogues de la réanimation",
  lede:"Pourquoi <strong>passent-elles obligatoirement sur voie centrale</strong> ? Comment les préparer, les surveiller, les sevrer ? Adrénaline, noradrénaline, dobutamine, éphédrine — chacune a son indication précise.",
  html:`
  <div class="card">
    <h3>Pourquoi voie centrale obligatoire ?</h3>
    <p>Les catécholamines sont des <strong>vasoconstricteurs puissants</strong>. En cas d'<strong>extravasation</strong> (passage du produit hors de la veine, dans les tissus mous) sur une VVP, la vasoconstriction locale provoque une <strong>ischémie</strong> puis une <strong>nécrose</strong> du tissu cutané et sous-cutané. La voie centrale, du fait de son débit sanguin élevé dans la VCS, <strong>dilue immédiatement</strong> le produit.</p>
    <div class="callout crit"><span class="label">Règle absolue</span> Noradrénaline, adrénaline en perfusion continue, dopamine forte dose : <strong>VVC ou PICC ou IO</strong> en urgence. <strong>Jamais VVP</strong> sauf situation d'extrême urgence en attendant la VVC.</div>
    <p>Si extravasation : arrêter immédiatement la perfusion, <strong>laisser le KT en place</strong>, aspirer le produit, antidote = <strong>phentolamine</strong> (α-bloquant) en infiltration sous-cutanée locale. Avis chirurgical.</p>
  </div>

  <div class="grid cols-2">

    <div class="card">
      <h3>Noradrénaline (Norépinéphrine)</h3>
      <span class="pill crit">α₁ +++</span> <span class="pill">Vasoconstricteur</span>
      <p>L'amine la plus utilisée en réa. <strong>Effet vasoconstricteur</strong> sur les artérioles → augmente la PAM. Peu d'effet sur le cœur (inotrope faible).</p>
      <dl class="kv">
        <dt>Indication principale</dt><dd>Choc septique, choc vasoplégique post-op</dd>
        <dt>Posologie</dt><dd>0,05 à 1-2 µg/kg/min IVSE — titré sur PAM</dd>
        <dt>Objectif</dt><dd>PAM ≥ 65 mmHg (souvent 65-75)</dd>
        <dt>Voie</dt><dd>VVC <strong>obligatoire</strong> en continu (IO/VVP transitoire en urgence)</dd>
        <dt>Surveillance</dt><dd>PA invasive (KTA), FC, diurèse, lactates, perfusion périphérique</dd>
      </dl>
      <div class="callout warn">Préparation classique : <strong>8 mg dans 48 mL NaCl 0,9%</strong> (soit 160 µg/mL) — protocoles variables : toujours vérifier celui du service.</div>
    </div>

    <div class="card">
      <h3>Adrénaline (Épinéphrine)</h3>
      <span class="pill crit">α + β₁ + β₂</span>
      <p><strong>Effet mixte</strong> : vasoconstricteur (α) + inotrope/chronotrope (β₁) + bronchodilatateur (β₂). Drogue de l'<strong>arrêt cardiaque</strong>.</p>
      <dl class="kv">
        <dt>ACR</dt><dd><strong>1 mg IVD ou IO</strong> toutes les 3-5 min (dose unique 1 mg = 1 amp de 1 mg/mL)</dd>
        <dt>Choc anaphylactique</dt><dd><strong>0,5 mg IM face antéro-latérale de la cuisse</strong> chez l'adulte (0,01 mg/kg enfant) — répéter à 5 min si besoin</dd>
        <dt>Choc cardiogénique / septique réfractaire</dt><dd>0,05-1 µg/kg/min IVSE en VVC</dd>
        <dt>Asthme aigu grave</dt><dd>0,3 mg SC ou IM</dd>
      </dl>
      <div class="callout crit"><strong>Anaphylaxie :</strong> jamais d'attente, jamais d'IV directe en première intention (risque de trouble du rythme). <strong>IM cuisse</strong> = standard.</div>
    </div>

    <div class="card">
      <h3>Dobutamine</h3>
      <span class="pill info">β₁ +++</span>
      <p><strong>Inotrope pur</strong> : augmente la <strong>contractilité cardiaque</strong> sans vasoconstriction marquée (peut même provoquer une vasodilatation). Pas de soutien tensionnel par vasoconstriction.</p>
      <dl class="kv">
        <dt>Indication</dt><dd>Choc cardiogénique, insuffisance cardiaque aiguë</dd>
        <dt>Posologie</dt><dd>2,5 à 20 µg/kg/min IVSE</dd>
        <dt>Voie</dt><dd>VVC recommandée (peut passer en VVP de gros calibre à dilution importante en attente VVC)</dd>
        <dt>Surveillance</dt><dd>FC (tachycardie+++), TdR, PAM, débit cardiaque, lactates, diurèse</dd>
      </dl>
      <p>Souvent <strong>associée à la noradré</strong> dans le choc septique avec dysfonction myocardique.</p>
    </div>

    <div class="card">
      <h3>Éphédrine</h3>
      <span class="pill good">Bloc / SSPI</span>
      <p>Action <strong>indirecte</strong> (libère la noradrénaline endogène). Effet vasopresseur modéré + inotrope. <strong>Utilisable en VVP</strong> car effet moins concentré et bref.</p>
      <dl class="kv">
        <dt>Indication phare</dt><dd>Hypotension après rachianesthésie ou induction d'AG</dd>
        <dt>Posologie</dt><dd>3-9 mg en bolus IVD, répété si besoin (amp 30 mg/10 mL diluée)</dd>
        <dt>CI relative</dt><dd>Tachycardie marquée</dd>
      </dl>
    </div>

    <div class="card">
      <h3>Néosynéphrine (Phényléphrine)</h3>
      <span class="pill">α₁ pur</span>
      <p>Vasoconstricteur α pur, <strong>sans effet chronotrope</strong> (ne tachycardise pas). Utilisée en bolus pour traiter une hypotension péri-anesthésique, parfois en IVSE en pédiatrie ou en obstétrique.</p>
      <dl class="kv">
        <dt>Posologie bolus</dt><dd>50-100 µg IVD (dilution stricte)</dd>
        <dt>Posologie IVSE</dt><dd>0,1-1 µg/kg/min en VVC</dd>
      </dl>
    </div>

    <div class="card">
      <h3>Dopamine</h3>
      <p>Action <strong>dose-dépendante</strong> : faible dose → vasodilatation rénale (effet aujourd'hui controversé), moyenne dose → inotrope (β₁), forte dose → vasoconstricteur (α). <strong>De moins en moins utilisée</strong> en réa au profit de noradré + dobutamine.</p>
      <dl class="kv">
        <dt>Posologie</dt><dd>2-20 µg/kg/min IVSE</dd>
        <dt>Voie</dt><dd>VVC (dose &gt; 5 µg/kg/min)</dd>
      </dl>
    </div>

    <div class="card">
      <h3>Isoprénaline (Isuprel)</h3>
      <p><strong>β₁ + β₂ pur</strong>. Effet chronotrope puissant (accélère le cœur). Utilisée dans les <strong>bradycardies extrêmes</strong>, torsades de pointes, blocs auriculo-ventriculaires complets en attendant un pacemaker.</p>
    </div>

    <div class="card">
      <h3>Vasopressine / Terlipressine</h3>
      <p>Action <strong>indépendante</strong> des récepteurs adrénergiques (récepteurs V1). Utilisée en seconde intention dans le choc septique réfractaire, ou en gastro pour les ruptures de varices œsophagiennes (terlipressine).</p>
    </div>

  </div>

  <div class="card">
    <h3>Règles pratiques de manipulation</h3>
    <ul>
      <li><strong>Une voie dédiée</strong> à la catécho (proximale du KT central de préférence) — pas de relais flou, jamais de bolus médicamenteux sur la même tubulure.</li>
      <li><strong>Pas d'arrêt brutal</strong> : sevrage <strong>progressif</strong>, par paliers, sous surveillance PAM (sinon rebond hypotensif).</li>
      <li><strong>Relais de seringue</strong> : "<em>en Y</em>", la nouvelle seringue est branchée et démarrée <strong>au même débit</strong> avant d'arrêter l'ancienne — pas de coupure. Certains services utilisent le SmartPump / changement automatique.</li>
      <li>Étiquetage clair de la seringue : <strong>nom DCI + concentration + débit cible</strong>.</li>
      <li>Tubulure spécifique catécho (souvent opaque/jaune), pas de filtre.</li>
      <li>Vérifier <strong>2 fois</strong> la concentration : préparation = source d'erreurs graves.</li>
    </ul>
  </div>
  `
},

{
  id:"transfu",
  num:"04",
  title:"Transfusion sanguine",
  eyebrow:"Chapitre 04 · CGR, PFC, plaquettes",
  lede:"Compatibilité, contrôle ultime, surveillance, complications. En urgence vitale : oui, on peut transfuser <strong>CGR et plasma simultanément</strong> — voire selon un protocole 1:1:1.",
  html:`
  <div class="card">
    <h3>Les produits sanguins labiles (PSL)</h3>
    <div class="table-wrap">
    <table>
      <thead><tr><th>Produit</th><th>Volume</th><th>Conservation</th><th>Durée de transfusion</th><th>Indication principale</th></tr></thead>
      <tbody>
        <tr><td><strong>CGR</strong> (concentré globulaire)</td><td>≈ 280 mL</td><td>+2 à +6 °C, 42 j</td><td>1h30 à 3h (max <strong>4h</strong>)</td><td>Anémie symptomatique, hémorragie</td></tr>
        <tr><td><strong>PFC</strong> (plasma frais congelé)</td><td>≈ 200 mL</td><td>Congelé −25°C ; décongelé → utilisable 6h max</td><td>30 min env. (selon prescription)</td><td>Coagulopathie, transfusion massive</td></tr>
        <tr><td><strong>CPA / MCP</strong> (plaquettes)</td><td>≈ 200-300 mL</td><td>+22 °C, agitation, 5 j</td><td>30 min env.</td><td>Thrombopénie &lt; 20 G/L ou hémorragique</td></tr>
      </tbody>
    </table>
    </div>
  </div>

  <div class="grid cols-2">

    <div class="card">
      <h3>Compatibilité ABO & Rhésus</h3>
      <h4>CGR — règle du donneur compatible</h4>
      <ul>
        <li><strong>O négatif</strong> = donneur universel CGR (urgence vitale immédiate)</li>
        <li><strong>AB positif</strong> = receveur universel CGR</li>
        <li>Toujours iso-Rhésus chez la femme en âge de procréer (prévention allo-immunisation anti-D)</li>
      </ul>
      <h4>PFC — règle inversée</h4>
      <ul>
        <li><strong>AB</strong> = donneur universel de plasma (pas d'anticorps anti-A ni anti-B)</li>
        <li><strong>O</strong> = receveur universel de plasma</li>
      </ul>
      <h4>Plaquettes</h4>
      <ul>
        <li>Compatibilité ABO préférable mais pas absolue. Rhésus important chez femme jeune.</li>
      </ul>
      <div class="callout info"><strong>Astuce mnémo :</strong> CGR = on transmet les <em>antigènes</em> du globule donneur. PFC = on transmet les <em>anticorps</em> du plasma → règle inverse.</div>
    </div>

    <div class="card">
      <h3>Avant la transfusion</h3>
      <ol>
        <li><strong>Prescription médicale</strong> nominative datée signée, indiquant le PSL et la quantité.</li>
        <li><strong>Groupage</strong> ABO/Rh (2 déterminations, 2 prélèvements distincts) + <strong>RAI</strong> de moins de 72h.</li>
        <li>Information du patient + consentement, vérification de l'identité.</li>
        <li>Réception du PSL : vérification concordance carte de groupe / poche / patient / fiche de délivrance.</li>
        <li><strong>Contrôle ultime pré-transfusionnel au lit du patient (CUPT)</strong> — étape <strong>infirmière</strong> incontournable.</li>
      </ol>

      <h4>Le Contrôle Ultime au lit du patient</h4>
      <p>Réalisé <strong>par l'IDE qui pose la poche</strong>, au lit, juste avant la pose. <strong>Pour chaque poche.</strong></p>
      <ul>
        <li>Contrôle de concordance : identité patient / fiche / carte de groupe / poche.</li>
        <li>Contrôle de compatibilité ABO sur <strong>carte type Beth-Vincent</strong> : on dépose 1 goutte de sang patient et 1 goutte de sang de la poche dans les puits avec sérums anti-A et anti-B → on lit l'agglutination.</li>
        <li>Ne jamais transfuser si le moindre doute.</li>
      </ul>
    </div>

    <div class="card">
      <h3>Pendant la transfusion</h3>
      <ul>
        <li>Constantes <strong>avant</strong>, puis à <strong>T+5, T+15 min</strong>, puis surveillance régulière jusqu'à la fin (PA, FC, T°, FR, SpO₂).</li>
        <li>Patient à portée de regard les premières minutes.</li>
        <li>Tubulure à <strong>filtre</strong> spécifique 170-260 µm.</li>
        <li>Voie veineuse de <strong>20 G minimum</strong> (idéal 18 G).</li>
        <li>Pas de médicament dans la même voie. Rinçage NaCl 0,9% avant/après. <strong>JAMAIS</strong> de Ringer Lactate sur la même ligne qu'un CGR (le calcium chélate le citrate anticoagulant → coagulation dans la tubulure).</li>
        <li>Durée : 1h30-3h pour CGR (jamais &gt;4h après sortie du frigo).</li>
      </ul>
    </div>

    <div class="card">
      <h3>Réaction transfusionnelle</h3>
      <p>Tout signe anormal : <strong>STOP immédiat de la transfusion</strong>, garder la voie veineuse avec NaCl 0,9%, appeler le médecin, conserver la poche + tubulure.</p>

      <h4>Signes d'alerte</h4>
      <ul>
        <li>Frissons, fièvre &gt; 1°C, sueurs.</li>
        <li>Douleur thoracique, lombaire, dyspnée, oppression.</li>
        <li>Hypotension, tachycardie, choc.</li>
        <li>Urticaire, prurit, angio-œdème.</li>
        <li>Urines rouges/foncées (hémolyse).</li>
      </ul>

      <h4>Étiologies à connaître</h4>
      <ul>
        <li><strong>Incompatibilité ABO</strong> (erreur d'identité) — hémolyse intravasculaire aiguë, urgence vitale.</li>
        <li><strong>TRALI</strong> : œdème pulmonaire lésionnel (anticorps anti-HLA du donneur).</li>
        <li><strong>TACO</strong> : surcharge volémique (OAP), sujet âgé / insuffisant cardiaque.</li>
        <li><strong>Allergie</strong> (urticaire → choc anaphylactique).</li>
        <li>Réaction <strong>fébrile non hémolytique</strong> (cytokines).</li>
        <li>Contamination bactérienne (rare, plaquettes++).</li>
      </ul>
      <div class="callout crit">Toute réaction → <strong>fiche d'effet indésirable receveur (EIR)</strong> + retour de la poche à l'EFS. C'est de la <strong>matériovigilance</strong> obligatoire.</div>
    </div>

    <div class="card">
      <h3>Transfusion massive — Hémorragie</h3>
      <div class="row-tags"><span class="pill crit">Urgence vitale</span></div>

  html:`
  <div class="card">
    <h3>Définition & principes</h3>
    <p>Le choc est une <strong>défaillance circulatoire aiguë et critique</strong> mettant en jeu le pronostic vital, avec un <strong>déficit de perfusion des organes</strong> et une altération du <strong>métabolisme cellulaire de l'oxygène</strong>. En cas d'échec des mécanismes de compensation :</p>
    <ul>
      <li>Hypoxie cellulaire</li>
      <li>Métabolisme anaérobie</li>
      <li>Production de <strong>lactates</strong></li>
      <li>Acidose métabolique lactique</li>
    </ul>
    <div class="callout crit"><strong>Piège fondamental :</strong> un patient peut être en choc <strong>avec une TA normale</strong> au début (compensation). Ce qui doit alerter : marbrures, oligurie, troubles neuro, lactates, polypnée. Ne pas attendre l'hypotension pour agir.</div>
  </div>

  <div class="grid cols-2">

    <div class="card">
      <h3>Signes cliniques — savoir les chercher</h3>
      <h4>Neurologiques</h4>
      <ul>
        <li>Agitation, confusion, somnolence, coma — reflet de l'hypoperfusion cérébrale.</li>
      </ul>
      <h4>Respiratoires</h4>
      <ul>
        <li><strong>Polypnée</strong> (souvent le tout premier signe — compense l'acidose métabolique et l'hypoxie).</li>
        <li>Dyspnée, tirage.</li>
      </ul>
      <h4>Cutanés (signes de bas débit)</h4>
      <ul>
        <li><strong>Marbrures</strong> (genoux, cuisses, abdomen) — score de marbrures sur 5.</li>
        <li>Pâleur, cyanose des extrémités.</li>
        <li>Froideur, extrémités glacées.</li>
        <li><strong>TRC (temps de recoloration cutanée) &gt; 3 secondes.</strong></li>
        <li>Augmentation du <strong>gradient de température centrale-périphérique</strong>.</li>
      </ul>
      <h4>Rénaux</h4>
      <ul>
        <li><strong>Oligurie</strong> &lt; 0,5 mL/kg/h. <em>Surveiller la diurèse !</em></li>
        <li>Anurie dans les formes sévères.</li>
      </ul>
      <h4>Digestifs</h4>
      <ul>
        <li>Diarrhées, douleurs abdominales (souffrance mésentérique).</li>
        <li>Iléus, vomissements.</li>
      </ul>
    </div>

    <div class="card">
      <h3>Signes de compensation</h3>
      <p>Le corps tente de maintenir la perfusion d'organe — c'est ce qui masque le choc à ses débuts.</p>
      <ul>
        <li><strong>Tachycardie</strong> (DC = VES × FC : si VES baisse, FC augmente pour compenser).</li>
        <li><strong>Vasoconstriction périphérique</strong> (priorise cœur/cerveau, sacrifie peau/reins/digestif).</li>
        <li><strong>Polypnée</strong> (compense l'acidose métabolique en éliminant du CO₂ ; compense l'hypoxie).</li>
      </ul>
      <div class="callout warn">Chez le sujet âgé, sous bêta-bloquants, ou en cas de neuropathie autonome (diabétique), la <strong>tachycardie peut manquer</strong> → ne pas se rassurer sur une FC normale.</div>
    </div>

    <div class="card">
      <h3>Rappels physiologiques essentiels</h3>
      <h4>Le cœur = pompe</h4>
      <p>Le <strong>débit cardiaque (DC)</strong> est ce qui irrigue les organes.</p>
      <p class="mono">DC = VES × FC</p>
      <p>Le <strong>volume d'éjection systolique (VES)</strong> dépend de :</p>
      <ul>
        <li><strong>Précharge</strong> (remplissage ventriculaire — déterminée par la volémie et le retour veineux)</li>
        <li><strong>Contractilité</strong> (inotropisme — fonction propre du muscle cardiaque)</li>
        <li><strong>Postcharge</strong> (résistances vasculaires que doit vaincre le VG)</li>
      </ul>

      <p class="mono">TaO₂ ≈ DC × Hb × SaO₂ × 1,34 + PaO₂ × 0,003</p>

        <li><strong>Hb</strong> (transfusion CGR)</li>
        <li><strong>SaO₂</strong> (oxygénothérapie, ventilation)</li>
      </ul>
      <p>Le chemin de l'O₂ : <strong>Transport (TaO₂)</strong> dans le sang → <strong>Extraction</strong> aux tissus → <strong>Consommation (VO₂)</strong> par les cellules. Un choc = défaillance à un ou plusieurs niveaux de cette chaîne.</p>
    </div>

    <div class="card">
      <h3>Gaz du sang dans le choc</h3>
      <h4>Valeurs de référence</h4>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Paramètre</th><th>Norme</th><th>Dans le choc</th></tr></thead>
          <tbody>

  <div class="card" style="margin-top:18px">

    <p>Mémo : <strong>distributif, cardiogénique, hypovolémique, obstructif</strong>. Chacun a un mécanisme distinct → traitement différent.</p>

      <p>Perte du tonus vasculaire → vasodilatation massive → hypovolémie <strong>relative</strong> (le contenant devient trop grand pour le contenu).</p>

      <h4>1) Choc septique</h4>

      <ul>
        <li><strong>Cause :</strong> infection sévère + réponse inflammatoire excessive (orage cytokinique).</li>
        <li><strong>Signes :</strong> fièvre OU hypothermie, frissons, foyer infectieux, hypotension persistant après remplissage, lactates &gt; 2.</li>
        <li><strong>Risques :</strong> CIVD, défaillance multiviscérale (SDMV).</li>
      </ul>
      <h5 style="margin:8px 0 4px;font-family:Fraunces,serif">Bundle 1 heure (Surviving Sepsis Campaign)</h5>
      <ol>
        <li>Dosage des <strong>lactates</strong>.</li>
        <li><strong>Hémocultures × 2</strong> AVANT antibiothérapie (sans la retarder).</li>
        <li><strong>Antibiothérapie probabiliste large spectre</strong> dans l'heure.</li>
        <li><strong>Remplissage 30 mL/kg</strong> de cristalloïde (Ringer Lactate).</li>
        <li><strong>Noradrénaline</strong> en VVC si PAM &lt; 65 après remplissage.</li>
        <li>Contrôle du foyer infectieux (drainage, chirurgie, retrait KT).</li>
      </ol>

      <h4>2) Choc anaphylactique</h4>

        <li><strong>Signes :</strong> prurit, urticaire, œdème de Quincke, bronchospasme, hypotension, douleur abdo, vomissements.</li>
      </ul>

        • <strong>0,01 mg/kg IM</strong> (max 0,5 mg adulte, 0,3 mg enfant)<br>
        • Face antéro-latérale de cuisse<br>
        • Renouvelable à 5 min si besoin<br>
        • <strong>Pas d'IV en première intention</strong> (risque TdR)
      </div>
      <p>Mesures associées : arrêt de l'allergène, O₂ haut débit (MHC), remplissage cristalloïde 500-1000 mL bolus, décubitus jambes surélevées, salbutamol nébulisé si bronchospasme. 2e ligne : corticoïdes, anti-H1. Si réfractaire : adrénaline IVSE en VVC.</p>

      <h4>3) Choc spinal (neurogénique)</h4>
      <ul>
        <li><strong>Cause :</strong> lésion médullaire (trauma rachis cervical/thoracique haut) → interruption du système sympathique → vasoplégie + bradycardie paradoxale.</li>
        <li><strong>Signes :</strong> hypotension, <strong>bradycardie</strong> (≠ autres chocs !), déficit neurologique, peau chaude et sèche.</li>

      </ul>
    </div>

        <li>Myocardite, cardiomyopathie décompensée.</li>
        <li>Valvulopathie aiguë (rupture de cordage, IM aiguë, dissection aortique sur valve).</li>
        <li>Toxique (β-bloquants, inhibiteurs calciques).</li>
      </ul>
      <h4>Signes</h4>
      <ul>
        <li>Orthopnée, OMI (œdèmes des membres inférieurs).</li>
        <li>OAP (œdème aigu du poumon) — crépitants, expectoration mousseuse rosée.</li>
        <li>Marbrures, douleur thoracique selon étiologie.</li>
        <li>Turgescence jugulaire (insuffisance ventriculaire droite associée).</li>
        <li>Hypotension, oligurie, conscience altérée.</li>
      </ul>
      <h4>Traitement</h4>
      <ul>
        <li><strong>Revascularisation</strong> en urgence si IDM (coronaro + angioplastie).</li>
        <li><strong>Dobutamine</strong> (inotrope β₁) en VVC : 2,5-20 µg/kg/min.</li>
        <li><strong>Noradrénaline</strong> si hypotension associée (souvent en association).</li>
        <li>Traitement du trouble du rythme (cardioversion, amiodarone, pacing).</li>
        <li>Diurétiques (furosémide) si surcharge.</li>
        <li>Assistance circulatoire (ECMO veino-artérielle, ballonnet de contre-pulsion, Impella) dans les formes graves.</li>
      </ul>

    </div>

    <div class="card">
      <h3>C. Choc hypovolémique</h3>
      <p>Perte de volume circulant — réelle, contrairement au choc distributif où elle est relative.</p>
      <h4>Causes</h4>
      <h5>Hémorragiques</h5>
      <ul>
        <li>Traumatisme, hémorragie digestive (HDH, HDB), rupture GEU.</li>
        <li>Hémorragie du post-partum, hématome rétropéritonéal sous AVK.</li>
      </ul>
      <h5>Non hémorragiques</h5>
      <ul>
        <li>Diarrhées, vomissements (gastro, occlusion).</li>
        <li>Brûlures étendues, exsudation de plaies.</li>
        <li>Acidocétose, déshydratation extracellulaire (3e secteur, ascite).</li>
      </ul>
      <h4>Signes</h4>
      <ul>
        <li><strong>Tachycardie +++</strong> (souvent &gt; 120).</li>
        <li>Soif intense, pâleur, sueurs.</li>
        <li><strong>TA pincée</strong> (PAS - PAD diminué : la PAD remonte par vasoconstriction avant que la PAS ne s'effondre).</li>
        <li>Hypotension orthostatique.</li>
        <li>Veines plates, TRC allongé.</li>
      </ul>
      <h4>Traitement</h4>
      <ul>
        <li><strong>Remplissage vasculaire massif</strong> (Ringer Lactate, NaCl 0,9%).</li>
        <li><strong>Traitement de la cause</strong> : hémostase chirurgicale ou endoscopique, FOGD, embolisation, compression directe.</li>
        <li><strong>Transfusion si hémorragie</strong> : protocole 1:1:1 (CGR : PFC : plaquettes), Exacyl 1 g si trauma &lt; 3h.</li>
        <li>Lutte contre la <strong>triade létale</strong> : acidose + hypothermie + coagulopathie.</li>
      </ul>
      <h4>Classification de l'hémorragie (ATLS)</h4>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Classe</th><th>Perte (% volémie)</th><th>FC</th><th>PAS</th><th>FR</th><th>Conscience</th></tr></thead>
          <tbody>
            <tr><td>I</td><td>&lt; 15%</td><td>&lt; 100</td><td>normale</td><td>14-20</td><td>normale</td></tr>
            <tr><td>II</td><td>15-30%</td><td>100-120</td><td>normale</td><td>20-30</td><td>anxieux</td></tr>
            <tr><td>III</td><td>30-40%</td><td>120-140</td><td>↓</td><td>30-40</td><td>confus</td></tr>
            <tr><td>IV</td><td>&gt; 40%</td><td>&gt; 140</td><td>↓↓</td><td>&gt; 35</td><td>léthargique</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h3>D. Choc obstructif</h3>
      <p>Obstacle mécanique au remplissage du cœur ou à l'éjection.</p>
      <h4>Causes principales</h4>
      <ul>
        <li><strong>Embolie pulmonaire</strong> massive — obstacle à l'éjection du VD.</li>
        <li><strong>Tamponnade péricardique</strong> — épanchement qui comprime le cœur, empêche le remplissage.</li>
        <li><strong>Pneumothorax compressif</strong> — bascule médiastinale, compression VCS.</li>
      </ul>
      <h4>Signes</h4>
      <ul>
        <li>Dyspnée, cyanose.</li>
        <li><strong>Turgescence jugulaire</strong> (pression veineuse centrale élevée).</li>
        <li>Signes de cœur droit (foie cardiaque, OMI).</li>
        <li>Tamponnade : pouls paradoxal, bruits du cœur assourdis (triade de Beck).</li>
        <li>PNO compressif : abolition murmure vésiculaire d'un côté, déviation trachéale.</li>
      </ul>

      <ul>
        <li><strong>EP grave</strong> : thrombolyse, anticoagulation, parfois embolectomie.</li>
        <li><strong>Tamponnade</strong> : drainage péricardique (péricardiocentèse écho-guidée) en urgence.</li>
        <li><strong>PNO compressif</strong> : exsufflation à l'aiguille (2e EIC ligne médio-claviculaire) puis drainage thoracique.</li>
      </ul>

    <h3>Prise en charge standardisée — séquence AMOPP</h3>
    <p>Séquence opérationnelle à mémoriser : <strong>Alerter, Monitorer, Oxygéner, Perfuser, Prélever</strong>.</p>
    <div class="grid cols-3">
      <div>
        <h4>1. ALERTER</h4>
        <ul>
          <li>Médecin du service</li>
          <li>Réanimateur</li>
          <li>Équipe d'urgence intra-hospitalière</li>
          <li>Rester avec le patient</li>
        </ul>
      </div>
      <div>
        <h4>2. MONITORER</h4>
        <ul>
          <li>Scope (FC, ECG continu)</li>
          <li>TA (manuelle puis automatique puis invasive)</li>
          <li>SpO₂</li>
          <li>Température</li>
          <li>Diurèse (sonde urinaire si nécessaire)</li>
        </ul>
      </div>
      <div>

        <ul>
          <li>O₂ haute concentration MHC 15 L/min</li>
          <li>Objectif <strong>SpO₂ &gt; 94%</strong></li>
          <li>VNI/intubation selon évolution</li>
        </ul>
      </div>

        <h4>4. PERFUSER</h4>
        <ul>
          <li><strong>2 VVP gros calibre (≥ 18 G)</strong></li>
          <li>Voie intra-osseuse si VVP échec</li>
          <li>Anticipation de la VVC</li>
        </ul>
      </div>
      <div>
        <h4>5. PRÉLEVER</h4>
        <ul>
          <li>GDS, lactates</li>
          <li>NFS, coagulation</li>
          <li>Ionogramme, créatinine</li>
          <li>CRP, PCT</li>
          <li>Groupage / RAI si transfusion possible</li>
          <li>Hémocultures × 2 si fièvre</li>
        </ul>
      </div>
      <div>

        <ul>
          <li>Cristalloïde : <strong>NaCl 0,9% ou Ringer Lactate</strong> (préféré en réa)</li>
          <li>500 mL en 15-30 min puis réévaluer</li>
          <li>Objectif : 30 mL/kg en sepsis</li>
          <li>Surveiller : <strong>œdème pulmonaire</strong>, crépitants, désaturation, dyspnée → STOP</li>
        </ul>
      </div>
    </div>

  </div>

        <li>Hypotension, marbrures, polypnée.</li>
        <li>Oligurie, troubles neurologiques (confusion, agitation).</li>
        <li>TRC &gt; 3 sec, extrémités froides.</li>
        <li>Lactates qui montent.</li>
      </ul>

      <ul>
        <li>Oxygénothérapie immédiate.</li>
        <li>Pose VVP × 2 gros calibre + prélèvements.</li>
        <li>Surveillance rapprochée (PA toutes les 5-10 min).</li>
        <li>Préparation du matériel d'urgence (BAVU, chariot d'urgence, défibrillateur, intubation).</li>
        <li>Hiérarchisation des soins, anticipation.</li>
        <li>Transmissions claires (SBAR).</li>
      </ul>
    </div>

      <div class="table-wrap">
        <table>
          <thead><tr><th>Type</th><th>Mécanisme</th><th>Traitement clé</th></tr></thead>
          <tbody>
            <tr><td>Septique (vasoplégique)</td><td>Infection → vasodilatation</td><td>ATB + Noradrénaline + remplissage + foyer</td></tr>
            <tr><td>Anaphylactique</td><td>Réaction allergique sévère</td><td><strong>Adrénaline IM</strong></td></tr>
            <tr><td>Cardiogénique</td><td>Défaillance de la pompe cardiaque</td><td>Inotropes (dobu) + revascularisation</td></tr>
            <tr><td>Hypovolémique</td><td>Perte de volume circulant</td><td>Remplissage + traitement cause</td></tr>
            <tr><td>Hémorragique</td><td>Perte sanguine</td><td>Arrêt saignement + transfusion 1:1:1</td></tr>
            <tr><td>Obstructif</td><td>Obstacle mécanique</td><td>Lever l'obstacle (drainage, thrombolyse, exsufflation)</td></tr>
            <tr><td>Spinal</td><td>Sympatholyse médullaire</td><td>Noradré + atropine, PAM ≥ 85</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h3>Points clés à retenir</h3>
      <ul>
        <li>✔ Un patient peut être en choc <strong>avec une TA normale</strong> au début.</li>
        <li>✔ La <strong>polypnée</strong> est un signe précoce souvent ignoré (compense l'acidose et l'hypoxie).</li>
        <li>✔ Toujours rechercher et traiter la <strong>cause</strong>, pas seulement les chiffres.</li>
        <li>✔ <strong>Temps = organe</strong> : prise en charge rapide et coordonnée.</li>
        <li>✔ Monitorage strict : <strong>diurèse, TA, lactates, état neurologique</strong>.</li>
        <li>✔ Marbrures et lactates sont les <strong>marqueurs cliniques et biologiques</strong> les plus parlants.</li>
        <li>✔ La PAM (≥ 65 mmHg) est plus utile que la PAS en réa.</li>
      </ul>
    </div>

    <div class="card">
      <h3>Score de marbrures (Mottling score)</h3>
      <p>Score de 0 à 5, évalué au <strong>genou</strong>. Excellent marqueur pronostique en réa.</p>
      <ul>
        <li><strong>0</strong> : aucune marbrure</li>
        <li><strong>1</strong> : limitée à la rotule (pièce de 2€)</li>
        <li><strong>2</strong> : limitée à la partie sup du genou</li>
        <li><strong>3</strong> : atteinte de la mi-cuisse</li>
        <li><strong>4</strong> : étendue à l'aine</li>
        <li><strong>5</strong> : extension au-delà de l'aine</li>
      </ul>
      <p>Score ≥ 4 à H6 d'admission en réa = mortalité &gt; 80%.</p>
    </div>

  </div>

      </ul>
    </div>

  <div class="grid cols-2">

    <div class="card">
      <h3>Règle de trois — la base</h3>
      <p>Si <em>A</em> contient <em>B</em>, alors <em>X</em> contient <em>?</em></p>
      <p class="mono">? = (B × X) / A</p>
      <h4>Exemple</h4>
      <p>On dispose d'ampoules de <strong>500 mg/10 mL</strong>. Prescription : <strong>250 mg</strong>. Combien de mL ?</p>
      <p class="mono">? = (10 × 250) / 500 = <strong>5 mL</strong></p>
    </div>

    <div class="card">
      <h3>Débit d'une perfusion en gouttes/min</h3>
      <p class="mono">Débit (gtt/min) = Volume (mL) × 20 / Durée (min)</p>
      <p>Approximation : <strong>1 mL = 20 gouttes</strong> (perfuseur standard adulte).</p>
      <h4>Exemple</h4>
      <p>500 mL à passer en 4h.</p>
      <p class="mono">= 500 × 20 / 240 = <strong>≈ 42 gouttes/min</strong></p>
      <p>Astuce mentale : <strong>mL/h ÷ 3 ≈ gtt/min</strong>. (125 mL/h → ≈ 42 gtt/min)</p>
    </div>

    <div class="card">
      <h3>Débit IVSE — mL/h depuis µg/kg/min</h3>
      <p>Cas classique : noradré 8 mg dans 48 mL (= 160 µg/mL). Prescription : 0,2 µg/kg/min chez un patient de 70 kg.</p>
      <ol>
        <li>Dose totale par minute : 0,2 × 70 = <strong>14 µg/min</strong></li>
        <li>Dose par heure : 14 × 60 = <strong>840 µg/h</strong></li>
        <li>Volume à passer : 840 / 160 = <strong>5,25 mL/h</strong></li>
      </ol>
      <p class="mono">Débit (mL/h) = (Dose µg/kg/min × poids × 60) / Concentration µg/mL</p>
    </div>

    <div class="card">
      <h3>Conversions utiles</h3>
      <ul>
        <li>1 g = 1000 mg = 1 000 000 µg</li>
        <li>1 mg = 1000 µg</li>
        <li>1% = 10 mg/mL (ex. lidocaïne 1% = 10 mg/mL)</li>
        <li>NaCl 0,9% = 9 g/L = 9 mg/mL</li>
        <li>G5% = 50 g de glucose / L</li>
        <li>1 mL = 20 gouttes (perfuseur adulte) ; 60 gouttes (microperfuseur pédiatrique)</li>
      </ul>
    </div>

    <div class="card">
      <h3>Posologie pédiatrique en mg/kg</h3>
      <p>Toujours en <strong>poids réel</strong> (sauf indications spécifiques). Exemple : paracétamol 15 mg/kg toutes les 6h.</p>

        <li>Dose max/24h = 60 mg/kg/j.</li>
      </ul>
    </div>

      <h3>Dilution & concentration finale</h3>
      <p>Diluer une amp de 1 g de cefazoline dans 100 mL → <strong>10 mg/mL</strong>.</p>
      <p>Diluer une amp de 250 mg de dobu dans 250 mL → <strong>1 mg/mL = 1000 µg/mL</strong>.</p>

    </div>

  </div>

  <div class="callout warn"><span class="label">Double check</span> Pour les médicaments à risque (insuline, KCl, héparine, anticancéreux, catécholamines) : <strong>vérification à deux IDE</strong> du calcul, de la concentration et du débit.</div>

  <div class="card">
    <h3>Bases de lecture</h3>
    <ul>
      <li><strong>Vitesse</strong> : 25 mm/s → 1 grand carreau = 5 mm = 0,20 s ; 1 petit = 1 mm = 0,04 s.</li>
      <li><strong>FC</strong> : 300 / nombre de grands carreaux entre 2 QRS (méthode rapide), ou 1500 / petits carreaux.</li>
      <li><strong>Rythme sinusal</strong> : onde P avant chaque QRS, P positive en DII, PR normal (120-200 ms), QRS fins.</li>
      <li><strong>QRS</strong> : &lt; 120 ms = fin ; ≥ 120 ms = large.</li>
      <li><strong>QT</strong> : doit rester &lt; moitié RR. QT long → torsade.</li>
    </ul>
  </div>

  <div class="grid cols-2">

    <div class="card">
      <h3>Fibrillation auriculaire (FA)</h3>
      <p><strong>Pas d'onde P</strong>, ligne de base ondulée, QRS fins <strong>irréguliers</strong>. Fréquence variable.</p>
      <ul>
        <li>Risque embolique (AVC) → anticoagulation selon CHA₂DS₂-VASc.</li>
        <li>Ralentissement : bêta-bloquants, digoxine, amiodarone.</li>
        <li>Réduction : cardioversion électrique ou pharmaco (amiodarone).</li>
      </ul>
    </div>

    <div class="card">
      <h3>Flutter auriculaire</h3>
      <p>Activité auriculaire régulière en "dents de scie" (onde F), souvent 300/min, avec conduction ventriculaire 2:1 ou 4:1.</p>
    </div>

    <div class="card">
      <h3>Tachycardie ventriculaire (TV)</h3>
      <div class="row-tags"><span class="pill crit">URGENCE</span></div>
      <p>QRS <strong>larges</strong>, réguliers, fréquence 150-250. Origine ventriculaire.</p>
      <ul>
        <li><strong>Avec pouls + stabilité</strong> : amiodarone IV, avis cardio.</li>
        <li><strong>Avec pouls + instabilité (choc, OAP, douleur)</strong> : cardioversion synchronisée.</li>
        <li><strong>Sans pouls</strong> = ACR rythme choquable : <strong>défibrillation</strong> + RCP.</li>
      </ul>
    </div>

    <div class="card">
      <h3>Torsade de pointes</h3>
      <p>TV polymorphe avec axe qui tourne autour de la ligne de base. Sur QT long. Risque de FV.</p>
      <ul>
        <li><strong>Sulfate de magnésium 2 g IV</strong>.</li>
        <li>Correction kaliémie, retrait des médicaments allongeant le QT (amiodarone, certains ATB, antipsychotiques…).</li>
        <li>Isoprénaline / pacing si bradycardie associée.</li>
      </ul>
    </div>

    <div class="card">
      <h3>Fibrillation ventriculaire (FV)</h3>
      <div class="row-tags"><span class="pill crit">ARRÊT</span></div>
      <p>Activité électrique <strong>chaotique</strong>, désorganisée, sans QRS identifiable. Pas de contraction efficace = pas de débit cardiaque.</p>
      <p><strong>= ACR avec rythme choquable.</strong> Défibrillation immédiate + RCP.</p>
    </div>

    <div class="card">
      <h3>Asystolie / AESP</h3>
      <p><strong>Asystolie</strong> : ligne plate (vérifier dérivations, gain, électrodes).</p>
      <p><strong>AESP</strong> : activité électrique organisée mais <strong>absence de pouls</strong>. Souvent rythme lent.</p>
      <p>Rythmes <strong>NON choquables</strong>. RCP + adrénaline 1 mg/3-5 min + recherche cause (4H/4T).</p>
    </div>

    <div class="card">
      <h3>Blocs auriculo-ventriculaires (BAV)</h3>
      <ul>
        <li><strong>BAV 1</strong> : PR allongé (&gt; 200 ms), bénin.</li>
        <li><strong>BAV 2 Mobitz I</strong> : PR qui s'allonge progressivement puis P bloquée (Wenckebach).</li>
        <li><strong>BAV 2 Mobitz II</strong> : P intermittentes bloquées sans allongement, risque évolutif.</li>
        <li><strong>BAV 3 (complet)</strong> : dissociation auriculo-ventriculaire totale. <strong>Urgence</strong> : risque syncope, mort subite. Atropine, isoprénaline, pacemaker.</li>
      </ul>
    </div>

    <div class="card">
      <h3>Syndrome coronarien aigu (signes ECG)</h3>
      <ul>
        <li><strong>STEMI</strong> : sus-décalage ST ≥ 1 mm (membres) / 2 mm (précordiales) dans 2 dérivations contiguës → reperfusion urgente.</li>
        <li>Localisation : <strong>antérieur</strong> V1-V4 (IVA), <strong>inférieur</strong> DII-DIII-aVF (CD), <strong>latéral</strong> DI-aVL-V5-V6.</li>
        <li>Inférieur → faire <strong>V3R-V4R + V7-V9</strong> (VD et postérieur).</li>
        <li><strong>NSTEMI / angor</strong> : sous-décalage ST, onde T négative, troponines en cinétique.</li>
        <li><strong>Onde Q</strong> de nécrose : tardive (séquelle).</li>
      </ul>
    </div>

  </div>
  `
},

      </ul>
      <h4>Hypokaliémie (K&lt;3,5)</h4>
      <ul>
        <li>ECG : T plates, U, sous-décalage ST, TdR.</li>
        <li>Cause fréquente : diurétiques, vomissements/diarrhée, hyperaldostéronisme.</li>
        <li>Correction lente IV (max 1 g/h VVP) + apport per os.</li>
      </ul>
    </div>

    <div class="card">
      <h3>Dysnatrémies</h3>
      <h4>Hyponatrémie</h4>
      <ul>
        <li>Risque convulsions, œdème cérébral.</li>
        <li>Correction <strong>très lente</strong> (&lt; 10 mmol/L/24h) sous peine de myélinolyse centro-pontine.</li>
        <li>Si symptomatique sévère : NaCl 3% en bolus.</li>
      </ul>
      <h4>Hypernatrémie</h4>
      <ul>
        <li>Souvent déshydratation. Apport d'eau libre (G5%) lentement.</li>
      </ul>
    </div>

    <div class="card">
      <h3>Bilan hépatique</h3>
      <ul>
        <li>ASAT/ALAT (cytolyse), GGT/PAL (cholestase), bilirubine (totale, conjuguée).</li>
        <li>Insuffisance hépato-cellulaire : <strong>TP/Facteur V bas</strong>, hypoalbuminémie, hypoglycémie.</li>
      </ul>
    </div>

  </div>
  `
},

  <div class="grid cols-2">

      <h4>Anesthésie générale (AG)</h4>
      <ul>
        <li>Triade : <strong>hypnotique + analgésique + curare</strong> (parfois).</li>
        <li>Induction : pré-oxygénation, hypnotique (propofol/étomidate), morphinique (sufenta), curare si intubation.</li>
        <li>Entretien : gaz halogénés (sévoflurane, desflurane) ou TIVA (propofol IV).</li>
        <li>Surveillance : capno, SpO₂, scope, BIS, curaromètre, T°.</li>
      </ul>
      <h4>Rachianesthésie</h4>
      <ul>
        <li>Injection unique d'anesthésique local <strong>dans le LCR</strong> (L3-L4 ou L4-L5).</li>
        <li>Bloc moteur + sensitif rapide, 2-4h. Chir membres inf, urologie, obstétrique.</li>
        <li>Risque : <strong>hypotension</strong> (sympatholyse) → éphédrine prête, remplissage.</li>
        <li>CI : refus, infection au site, coagulopathie, hypertension intracrânienne, instabilité HD majeure.</li>
      </ul>
      <h4>Péridurale</h4>
      <ul>
        <li>Cathéter dans l'espace <strong>péridural</strong>, perfusion continue.</li>
        <li>Analgésie obstétricale, post-op thoracique/abdominale.</li>
      </ul>
      <h4>Anesthésie locorégionale (ALR)</h4>
      <ul>
        <li>Bloc plexique ou tronculaire écho-guidé (interscalénique, axillaire, fémoral, sciatique).</li>
        <li>Évite les risques de l'AG, post-op moins douloureux.</li>
      </ul>
    </div>

    <div class="card">

      <p>Trois temps obligatoires, à voix haute, équipe entière.</p>
      <ul>
        <li><strong>Avant induction</strong> : identité, intervention prévue, côté à opérer, allergies, jeûne, antibioprophylaxie, capital veineux, dossier complet.</li>
        <li><strong>Avant incision (Time-Out)</strong> : confirmation de tous, antibioprophylaxie effective, matériel disponible.</li>
        <li><strong>Avant sortie de salle</strong> : compte des compresses, comptage des aiguilles, dispositifs laissés, étiquetage prélèvements, transmission.</li>
      </ul>

      <h3>SSPI — Salle de Surveillance Post-Interventionnelle</h3>

        <li>Pansement, drainage, diurèse, saignement.</li>
        <li>Reprise de la motricité (rachi/péridurale).</li>

        <li><strong>Circulation</strong> : 0-1-2 (PA &gt; 50% / 20-50% / &lt; 20% de la PA pré-op)</li>

        <li>0-1 pt : pas de prophylaxie systématique.</li>
        <li>2 pts : 1-2 antiémétiques (dexaméthasone + ondansétron).</li>

      <p>Curatif : ondansétron 4 mg IV, dropéridol, métoclopramide.</p>
    </div>

    <div class="card">
      <h3>Hyperthermie maligne</h3>
      <div class="row-tags"><span class="pill crit">URGENCE rare</span></div>
      <p>Réaction génétique à certains anesthésiques (halogénés, succinylcholine). Hypermétabolisme musculaire massif.</p>
      <ul>
        <li>Signes : ↑ ETCO₂ inexpliquée, tachycardie, rigidité, hyperthermie, acidose, rhabdomyolyse, hyperkaliémie.</li>

        <li>Circuit "propre/sale" (propre, salle, décontamination matériel).</li>
      </ul>
    </div>

      <li>Pas de bijoux (alliance discrète tolérée selon services), ongles courts, sans vernis.</li>
      <li>Cheveux attachés, tenue professionnelle propre.</li>
      <li>Gestion des piquants-tranchants : <strong>boîte OPCT</strong> à proximité, pas de recapuchonnage.</li>
      <li>Entretien des surfaces, du matériel partagé.</li>
    </ul>
  </div>

      <div class="row-tags"><span class="pill warn">Signalisation rouge</span></div>

{
  id:"drains",
  num:"15",
  title:"Drains, sondes & pansements",
  eyebrow:"Chapitre 15 · Redon, SNG, sonde U, VAC, stomies",
  lede:"Identifier chaque dispositif, le surveiller, le retirer dans les règles.",
  html:`
  <div class="grid cols-2">

    <div class="card">
      <h3>Drains chirurgicaux</h3>
      <h4>Drain de Redon</h4>
      <ul>
        <li>Drain aspiratif (bocal sous vide), post-op chir orthopédique, thyroïdienne, mammaire.</li>
        <li>Surveiller : volume, aspect, perméabilité, vide effectif (bocal "rétracté").</li>
        <li>Retrait sur prescription quand volume &lt; seuil (souvent &lt; 30-50 mL/24h).</li>
      </ul>
      <h4>Drains de Penrose / lame</h4>
      <ul>
        <li>Drainage <strong>passif</strong>, par capillarité. Pansement absorbant.</li>
      </ul>
      <h4>Drain thoracique</h4>
      <ul>
        <li>Système à 3 chambres (recueil, valve hydraulique, contrôle aspiration).</li>
        <li>Surveillance : oscillations à la respiration, bullage, quantité, aspect.</li>
        <li><strong>Clamper en urgence</strong> uniquement sur prescription / si déconnexion accidentelle. Pas de remontée du bocal au-dessus du thorax.</li>
      </ul>
    </div>

    <div class="card">
      <h3>Sonde naso-gastrique (SNG)</h3>
      <ul>
        <li>Indications : nutrition entérale, aspiration (occlusion, post-op digestif), lavage.</li>
        <li>Pose : mesure nez-lobe d'oreille-xyphoïde, lubrification, position assise tête fléchie, déglutition.</li>
        <li><strong>Vérification du bon positionnement</strong> obligatoire avant utilisation :
          <ul>
            <li>Radio thoraco-abdominale (gold standard pour la nutrition prolongée),</li>
            <li>Test du pH du liquide aspiré (&lt; 5,5 = gastrique),</li>
            <li>Auscultation épigastrique à l'insufflation (sensibilité limitée).</li>
          </ul>
        </li>
        <li>Surveillance : fixation, longueur extériorisée, état du nez, tolérance, résidus gastriques pour la NE.</li>
      </ul>
    </div>

    <div class="card">
      <h3>Sonde urinaire (sonde vésicale)</h3>
      <ul>
        <li>Indications : RAU, surveillance diurèse en réa/post-op lourd, irrigation, immobilisation prolongée avec incontinence.</li>
        <li>Pose <strong>aseptique stricte</strong> (système clos). Risque majeur : <strong>infection urinaire nosocomiale</strong>.</li>
        <li>Sac de drainage <strong>en déclive</strong>, ne jamais remonter au-dessus de la vessie.</li>
        <li>Toilette périnéale 1-2 fois/jour, pas d'antiseptique routinier.</li>
        <li>Indication réévaluée <strong>quotidiennement</strong> : <strong>retirer dès que possible</strong>.</li>
      </ul>
    </div>

    <div class="card">
      <h3>Pansement VAC (TPN)</h3>
      <p>Thérapie par Pression Négative. Mousse + film occlusif + dépression. Favorise la cicatrisation, draine les exsudats.</p>
      <ul>
        <li>Indications : plaies chroniques, escarres, déhiscence post-op, peri-greffes.</li>
        <li>Surveillance : étanchéité, aspect des exsudats, dépression effective, douleur lors du changement.</li>
      </ul>
    </div>

    <div class="card">
      <h3>Stomies digestives</h3>
      <ul>
        <li><strong>Iléostomie</strong> : effluents liquides abondants, attention à la déshydratation et hyponatrémie.</li>
        <li><strong>Colostomie</strong> : effluents plus solides selon la localisation (transverse, sigmoïde).</li>
        <li>Surveillance : couleur (rosée), œdème, saignement, irritation péristomiale, complications (prolapsus, hernie, sténose).</li>
        <li>Appareillage : poche vidangeable ou fermée + support, adaptée à la morphologie.</li>
      </ul>
    </div>

    <div class="card">
      <h3>Échelle de Braden (escarres)</h3>
      <p>6 items : perception sensorielle, humidité, activité, mobilité, nutrition, friction. Score / 23. <strong>Risque si ≤ 18.</strong></p>
      <p>Prévention : mobilisation/2-3h, matelas adapté, hydratation cutanée, équilibre nutritionnel, surveillance des points d'appui (sacrum, talons, occiput, trochanters).</p>
    </div>

  </div>
  `
},

  <div class="grid cols-2">

        <li><strong>Ceftriaxone</strong> : 1-2 g/j en 1 prise IV/IM/SC. <strong>JAMAIS avec Ringer Lactate</strong> chez le nouveau-né (précipitation Ca-ceftriaxone fatale).</li>
      </ul>
    </div>

    <div class="card">
      <h3>Aminosides</h3>
      <ul>
        <li>Gentamicine, amikacine, tobramycine.</li>
        <li><strong>Dose unique journalière</strong>, perfusion <strong>de 30 min</strong>.</li>
        <li>Toxicité <strong>rénale</strong> (DFG !) et <strong>cochléo-vestibulaire</strong> (irréversible).</li>
        <li>Surveillance : pic (1h après) + résiduelle (avant la dose suivante). Durée &lt; 5-7 j en règle.</li>
      </ul>
    </div>

    <div class="card">
      <h3>Glycopeptides</h3>
      <ul>
        <li><strong>Vancomycine</strong> : SARM, infections graves Gram +.</li>
        <li>Perfusion <strong>lente</strong> minimum <strong>60 min</strong> par gramme (Red Man Syndrome si trop rapide → érythème).</li>
        <li>Surveillance : <strong>taux résiduel</strong> (cible 15-20 mg/L selon indication), créatinine.</li>
        <li>Teicoplanine (Targocid) : alternative, SC ou IV, demi-vie longue, dose de charge nécessaire.</li>
      </ul>
    </div>

    <div class="card">
      <h3>Fluoroquinolones</h3>
      <ul>
        <li>Ciprofloxacine, lévofloxacine, ofloxacine, moxifloxacine.</li>
        <li>Bonne biodisponibilité PO = IV.</li>
        <li>ES : tendinopathies (Achille), QT long, photosensibilité, neurotoxicité.</li>
        <li>CI / précautions : enfant, grossesse, ATCD tendinopathie, QT long.</li>
      </ul>
    </div>

    <div class="card">
      <h3>Macrolides</h3>
      <ul>
        <li>Azithromycine, clarithromycine, érythromycine.</li>
        <li>Pneumopathie atypique, coqueluche.</li>
        <li>ES : <strong>QT long</strong>, troubles digestifs, interactions médicamenteuses (cytochrome P450).</li>
      </ul>
    </div>

      <ul>
        <li>Anaérobies, Clostridioides difficile, amibiase.</li>
        <li>Effet "<strong>antabuse</strong>" avec l'alcool : flush, NV, malaise. Information patient.</li>
      </ul>
    </div>

      <ul>
        <li>Réserve hospitalière (SARM résistant, ERG).</li>

        <li>Daptomycine : CPK (rhabdomyolyse), pas en pneumopathie (inactivé par surfactant).</li>
      </ul>
    </div>

      <ul>
        <li><strong>Prélèvements bactério AVANT</strong> (hémocs ×2, ECBU, expecto, LCR…). Ne jamais retarder l'ATB en cas de sepsis grave.</li>

        <li>Respect des horaires (intervalles fixes, surveillance des taux), ne pas mélanger des incompatibilités dans la même tubulure.</li>
      </ul>
    </div>

  </div>
