{
  id:"divers",
  num:"17",
  title:"À savoir absolument — divers",
  eyebrow:"Chapitre 17 · pièges, mnémos, repères",
  lede:"Une compilation de notions pratiques qui reviennent constamment en service.",
  html:`
  <div class="grid cols-2">

    <div class="card">
      <h3>Identitovigilance</h3>
      <ul>
        <li><strong>2 identifiants stricts</strong> minimum : nom de naissance + prénom + date de naissance (parfois sexe).</li>
        <li>Vérification AVANT tout acte : prescription, transfusion, prélèvement, médicament.</li>
        <li>Bracelet d'identification systématique.</li>
        <li>Questionnement ouvert : "<em>quel est votre nom ?</em>" (pas "<em>vous êtes bien M. X ?</em>").</li>
      </ul>
    </div>

    <div class="card">
      <h3>Règle des 5 B / 7 B (médicament)</h3>
      <ul>
        <li><strong>B</strong>on patient</li>
        <li><strong>B</strong>on médicament</li>
        <li><strong>B</strong>onne dose</li>
        <li><strong>B</strong>onne voie</li>
        <li><strong>B</strong>on moment</li>
        <li>+ <strong>B</strong>onne documentation (traçabilité)</li>
        <li>+ <strong>B</strong>onne raison (vérifier l'indication)</li>
      </ul>
    </div>

    <div class="card">
      <h3>Hiérarchie des dispositifs d'oxygène</h3>
      <p>Pour s'en souvenir vite : "<em>plus la détresse est grande, plus le débit et la FiO2 montent</em>".</p>
      <ol>
        <li>Lunettes (confort, ≤ 6 L/min)</li>
        <li>Masque simple</li>
        <li>MHC ballon (urgence)</li>
        <li>Optiflow (haut débit nasal)</li>
        <li>VNI (CPAP / BiPAP)</li>
        <li>Intubation</li>
      </ol>
    </div>

    <div class="card">
      <h3>Triangle de Sécurité Transfusionnelle</h3>
      <ol>
        <li>Le bon produit</li>
        <li>Au bon patient</li>
        <li>Au bon moment</li>
      </ol>
      <p>… vérifié par le <strong>contrôle ultime au lit</strong> systématique pour <strong>chaque poche</strong>.</p>
    </div>

    <div class="card">
      <h3>Erreurs "à risque vital" à connaître</h3>
      <ul>
        <li><strong>KCl IVD</strong> = arrêt cardiaque.</li>
        <li><strong>Ringer Lactate + CGR</strong> = coagulation tubulure (calcium chélate le citrate).</li>
        <li><strong>Catécho en VVP</strong> = nécrose à l'extravasation.</li>
        <li><strong>Ceftriaxone + RL chez nouveau-né</strong> = précipitation létale.</li>
        <li><strong>Bolus d'insuline en SC</strong> à mauvaise dose = hypoglycémie sévère.</li>
        <li><strong>Mauvaise identité</strong> en transfusion = incompatibilité ABO.</li>
        <li><strong>Drain thoracique remonté au-dessus du patient</strong> = reflux dans la cavité.</li>
      </ul>
    </div>

    <div class="card">
      <h3>Transmissions ciblées — DAR / SBAR</h3>
      <p><strong>DAR</strong> (modèle FR) : Données — Actions — Résultats. Ex. cible "Douleur" → D : EN 6/10 — A : palier 2 administré — R : EN 2/10 à 1h.</p>
      <p><strong>SBAR</strong> (modèle anglo-saxon, appels médecins) :</p>
      <ul>
        <li><strong>S</strong>ituation : qui ? où ? pourquoi j'appelle ?</li>
        <li><strong>B</strong>ackground : ATCD, contexte, traitement.</li>
        <li><strong>A</strong>ssessment : ce que je vois, constantes, mon analyse.</li>
        <li><strong>R</strong>ecommendation : ce que je propose / demande.</li>
      </ul>
    </div>

    <div class="card">
      <h3>Quelques repères chiffrés à connaître par cœur</h3>
      <ul>
        <li>Diurèse minimale : <strong>0,5 mL/kg/h</strong>.</li>
        <li>PAM cible : ≥ <strong>65 mmHg</strong>.</li>
        <li>Glasgow → intubation : ≤ <strong>8</strong>.</li>
        <li>Hb → CGR : &lt; <strong>7 g/dL</strong> (8 si cardiopathie).</li>
        <li>FiO2 air ambiant : <strong>21%</strong>.</li>
        <li>SpO₂ cible : ≥ 95% (88-92% BPCO).</li>
        <li>MCE : <strong>100-120/min</strong>, <strong>5-6 cm</strong>.</li>
        <li>Adrénaline ACR : <strong>1 mg / 3-5 min</strong>.</li>
        <li>Amiodarone FV/TV : <strong>300 mg</strong> après 3<sup>e</sup> choc.</li>
        <li>Ratio 30:2 (RCP non intubé), continu si intubé + 10 ventilations/min.</li>
      </ul>
    </div>

    <div class="card">
      <h3>Position du patient — réflexes</h3>
      <ul>
        <li><strong>OAP / dyspnée</strong> : assis jambes pendantes.</li>
        <li><strong>Hypotension / malaise vagal</strong> : décubitus dorsal jambes surélevées.</li>
        <li><strong>Trouble de conscience sans VAS sécurisées</strong> : <strong>PLS</strong>.</li>
        <li><strong>HTIC suspecte (AVC, TC)</strong> : tête à 30°, axe rectiligne.</li>
        <li><strong>Femme enceinte au 3<sup>e</sup> trimestre</strong> : <strong>DLG</strong> (décubitus latéral gauche) ou inclinaison du bassin pour éviter la compression de la VCI.</li>
        <li><strong>Patient intubé/ventilé</strong> : semi-assis 30-45° (prévention PAVM).</li>
        <li><strong>SDRA</strong> : <strong>décubitus ventral</strong> (DV) 12-16h/24h.</li>
      </ul>
    </div>

    <div class="card">
      <h3>Jeûne pré-opératoire (ESA/SFAR)</h3>
      <ul>
        <li>Liquides clairs (eau, café/thé sans lait, jus sans pulpe) : <strong>2h</strong>.</li>
        <li>Lait maternel (nourrisson) : <strong>4h</strong>.</li>
        <li>Lait infantile, repas léger : <strong>6h</strong>.</li>
        <li>Repas gras / viande : <strong>8h</strong>.</li>
      </ul>
    </div>

    <div class="card">
      <h3>NEWS — déclencher l'appel</h3>
      <p>Si l'un de ces critères est isolé, alerter : <strong>FR &lt; 8 ou &gt; 25</strong>, <strong>SpO₂ &lt; 92%</strong> en air ambiant, <strong>PAS &lt; 90 ou &gt; 220</strong>, <strong>FC &lt; 40 ou &gt; 130</strong>, <strong>désorientation/somnolence brutale</strong>, <strong>T° &lt; 35 ou &gt; 39</strong>, <strong>diurèse &lt; 0,5 mL/kg/h</strong> sur 2h.</p>
    </div>

    <div class="card">
      <h3>Intubation en Séquence Rapide (ISR)</h3>
      <p>Procédure d'urgence pour intuber un patient à <strong>estomac plein</strong> (risque inhalation).</p>
      <ol>
        <li><strong>Préparation</strong> : matériel d'aspiration prêt, BAVU + O₂, laryngoscope, sondes (taille 7-7,5 femme, 7,5-8 homme), KT, médicaments.</li>
        <li><strong>Pré-oxygénation</strong> au MHC ou Optiflow 3 min (idéalement 100% O₂).</li>
        <li><strong>Manœuvre de Sellick</strong> (pression cricoïdienne — controversée mais souvent encore appliquée).</li>
        <li><strong>Hypnotique</strong> : étomidate 0,3 mg/kg ou kétamine 1-2 mg/kg (stabilité HD).</li>
        <li><strong>Curare</strong> : succinylcholine 1 mg/kg ou rocuronium 1 mg/kg.</li>
        <li>Intubation, vérification : capno, auscultation symétrique, buée, expansion thoracique, RX.</li>
        <li>Fixation, gonflage ballonnet 20-30 cmH₂O.</li>
      </ol>
      <p>Rôle IDE : aspiration, monitorage continu, médicaments à la seringue prête, ventilation au BAVU, manœuvre cricoïdienne au besoin.</p>
    </div>

    <div class="card">
      <h3>Équivalences opioïdes (équianalgésie)</h3>
      <p>Approximations pour la conversion. Toujours <strong>réduire de 25-50%</strong> lors d'une rotation pour la tolérance croisée incomplète.</p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Opioïde</th><th>Équivalent à 10 mg morphine PO</th></tr></thead>
          <tbody>
            <tr><td>Morphine PO</td><td>10 mg</td></tr>
            <tr><td>Morphine SC</td><td>5 mg (rapport 1/2)</td></tr>
            <tr><td>Morphine IV</td><td>3 mg env. (rapport 1/3)</td></tr>
            <tr><td>Oxycodone PO</td><td>5 mg</td></tr>
            <tr><td>Tramadol PO</td><td>100 mg env.</td></tr>
            <tr><td>Codéine PO</td><td>60 mg env.</td></tr>
            <tr><td>Fentanyl patch</td><td>25 µg/h ≈ 60 mg morphine PO/j</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h3>Glycémies cibles en hospitalisation</h3>
      <ul>
        <li><strong>Patient stable</strong> : 1,4-1,8 g/L (7,8-10 mmol/L).</li>
        <li><strong>Réa</strong> : 1,4-1,8 g/L — éviter les hypoglycémies (plus délétères que l'hyperglycémie modérée).</li>
        <li><strong>Acidocétose</strong> : insuline IVSE, baisse progressive (≤ 0,5 g/L/h), correction kaliémie, hydratation.</li>
        <li><strong>Coma hyperosmolaire</strong> : réhydratation prudente, insuline.</li>
      </ul>
    </div>

    <div class="card">
      <h3>Mort encéphalique</h3>
      <p>Conditions strictes (loi française) : étiologie connue + absence de cause confondante (sédation, hypothermie, troubles métaboliques).</p>
      <h4>Critères cliniques</h4>
      <ul>
        <li>Coma profond, aréactif (GCS 3).</li>
        <li>Absence de tous les réflexes du tronc cérébral (photomoteur, cornéen, oculo-cardiaque, vestibulaire, toux).</li>
        <li>Absence de ventilation spontanée (test d'apnée standardisé).</li>
      </ul>
      <h4>Examens complémentaires (un des 2)</h4>
      <ul>
        <li><strong>2 EEG plats</strong> à 4h d'intervalle, ≥ 30 min, à amplification maximale.</li>
        <li><strong>Angio-TDM cérébrale</strong> ou artériographie : absence de circulation cérébrale.</li>
      </ul>
      <p>Si compatible avec un prélèvement d'organes : démarche avec la <strong>coordination hospitalière</strong> + abord des proches. Maintien strict de l'hémodynamique et de l'oxygénation jusqu'au prélèvement.</p>
    </div>

    <div class="card">
      <h3>Soins de bouche en réa</h3>
      <ul>
        <li><strong>Toutes les 4 heures</strong> chez le patient intubé/ventilé.</li>
        <li>Chlorhexidine buccale 0,12-0,2% : ↓ pneumopathies acquises sous ventilation (PAVM).</li>
        <li>Aspiration sus-glottique avant tout mouvement / repositionnement du ballonnet.</li>
        <li>Position semi-assise 30-45°.</li>
      </ul>
    </div>

    <div class="card">
      <h3>Prévention de la PAVM (bundle)</h3>
      <ul>
        <li>Position semi-assise 30-45°.</li>
        <li>Soins de bouche chlorhexidine /4h.</li>
        <li>Fenêtres de sédation quotidiennes + tests de sevrage de la ventilation.</li>
        <li>Aspirations stériles à la demande, ballonnet 20-30 cmH₂O.</li>
        <li>Prévention thromboembolique et ulcère de stress.</li>
      </ul>
    </div>

    <div class="card">
      <h3>Calcul rapide du débit IVSE — astuce</h3>
      <p>Pour une noradrénaline préparée à <strong>0,1 mg/mL = 100 µg/mL</strong> (8 mg dans 80 mL) chez un adulte de 70 kg :</p>
      <p class="mono">Débit (mL/h) = Dose (µg/kg/min) × poids × 0,6</p>
      <p>Ex. 0,2 µg/kg/min × 70 × 0,6 = <strong>8,4 mL/h</strong>. À <strong>vérifier toujours</strong> avec la concentration exacte de votre service.</p>
    </div>

    <div class="card">
      <h3>Patients à risque accru — alertes mentales</h3>
      <ul>
        <li><strong>Sujet âgé</strong> : déshydratation rapide, polymédication, confusion sous benzos/morphine, capital veineux fragile.</li>
        <li><strong>Insuffisant rénal</strong> : adapter posologies (aminosides, héparine, opioïdes), pas d'AINS, attention iode et certains AOD.</li>
        <li><strong>Insuffisant hépatique</strong> : éviter paracétamol forte dose, attention BZD à demi-vie longue.</li>
        <li><strong>Femme enceinte</strong> : DLG, médicaments à vérifier (CRAT.fr), vaccins inactivés OK.</li>
        <li><strong>Diabétique</strong> : HGT fréquents, surveillance des pieds, NV peuvent masquer acidocétose.</li>
        <li><strong>BPCO</strong> : SpO₂ cible 88-92%, attention sédatifs.</li>
      </ul>
    </div>

  </div>
  `
},

/* ===================== RENDER ===================== */
const mainEl = document.getElementById('main');
const navEl = document.getElementById('nav');
const navMobile = document.getElementById('navMobile');
const searchInput = document.getElementById('searchInput');

function renderNav(){
  navEl.innerHTML = '';
  navMobile.innerHTML = '';
  SECTIONS.forEach((s,i)=>{
    const b = document.createElement('button');
    b.innerHTML = `<span class="num">${s.num}</span><span>${s.title}</span>`;
    b.dataset.id = s.id;
    b.addEventListener('click',()=>show(s.id));
    navEl.appendChild(b);

    const o = document.createElement('option');
    o.value = s.id; o.textContent = `${s.num} · ${s.title}`;
    navMobile.appendChild(o);
  });
  navMobile.addEventListener('change',e=>show(e.target.value));
}

function renderSections(){
  mainEl.innerHTML = '';
  SECTIONS.forEach(s=>{
    const sec = document.createElement('section');
    sec.id = `sec-${s.id}`;
    sec.innerHTML = `
      <div class="hero">
        <div class="eyebrow">${s.eyebrow}</div>
        <h2 class="title">${s.title.replace(/—/,'<em>—</em>')}</h2>
        <p class="lede">${s.lede}</p>
      </div>
      ${s.html}
    `;
    mainEl.appendChild(sec);
  });
  renderQuiz();
}

function renderQuiz(){
  const list = document.getElementById('quizList');
  if(!list) return;
  list.innerHTML = '';
  QUIZ.forEach(([q,a])=>{
    const d = document.createElement('div');
    d.className = 'qa';
    d.innerHTML = `<div class="q">${q}</div><div class="a">${a}</div>`;
    d.addEventListener('click',()=>d.classList.toggle('open'));
    list.appendChild(d);
  });
}

function show(id){
  document.querySelectorAll('section').forEach(el=>el.classList.remove('show'));
  document.getElementById('sec-'+id)?.classList.add('show');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active', b.dataset.id===id));
  navMobile.value = id;
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ============ SEARCH ============ */
function escapeHTML(str){return str.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function escapeReg(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}

function runSearch(q){
  q = q.trim();
  if(!q){
    // restore
    document.querySelectorAll('section').forEach(el=>el.innerHTML = el.dataset.original || el.innerHTML);
    document.querySelectorAll('section').forEach(el=>el.classList.remove('show'));
    document.getElementById('sec-'+SECTIONS[0].id).classList.add('show');
    document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',i===0));
    return;
  }
  const reg = new RegExp(escapeReg(q),'gi');
  let totalHits = 0;
  SECTIONS.forEach(s=>{
    const sec = document.getElementById('sec-'+s.id);
    if(!sec.dataset.original) sec.dataset.original = sec.innerHTML;
    const has = sec.dataset.original.replace(/<[^>]+>/g,' ').match(reg);
    if(has){
      totalHits += has.length;
      sec.innerHTML = sec.dataset.original.replace(/>([^<]+)</g,(m,txt)=>'>'+txt.replace(reg,x=>`<mark>${x}</mark>`)+'<');
      sec.classList.add('show');
    }else{
      sec.classList.remove('show');
    }
  });
  if(totalHits===0){
    SECTIONS.forEach(s=>{
      const sec = document.getElementById('sec-'+s.id);
      if(sec.dataset.original) sec.innerHTML = sec.dataset.original;
    });
    document.getElementById('sec-'+SECTIONS[0].id).innerHTML = `<div class="empty"><h3 style="font-family:Fraunces,serif">Aucun résultat pour <em>« ${escapeHTML(q)} »</em></h3><p>Essaye un autre terme (ex. <em>cathécho</em>, <em>VVC</em>, <em>FiO2</em>, <em>Glasgow</em>, <em>plasma</em>).</p></div>`;
    document.getElementById('sec-'+SECTIONS[0].id).classList.add('show');
  }
}

searchInput.addEventListener('input',e=>runSearch(e.target.value));

/* ============ INIT ============ */
renderNav();
renderSections();
show(SECTIONS[0].id);
</script>
